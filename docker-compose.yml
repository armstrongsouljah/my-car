services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mycar
      POSTGRES_USER: mycar
      POSTGRES_PASSWORD: mycar
    ports:
      # Only the host-side port is configurable — lets a second stack (e.g.
      # the dev environment, see docker-compose.dev.yml/#81) run alongside
      # this one on the same droplet without a port clash. Not env-driven
      # for DATABASE_URL below since that always addresses the sibling
      # container by service name, never through this host-published port.
      - "127.0.0.1:${DB_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycar"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    environment: &api_env
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your .env (see .env.example)}
      DEBUG: ${DEBUG:-True}
      # Defaults match local Compose; a deployment overrides these via .env
      # (see .env.example) rather than editing this file. The Postgres
      # password below is still dev-only — never reuse it for a deployment.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,api,host.docker.internal}
      # Blank locally (no proxy in front). A deployment behind Caddy must set
      # this to 1 — see the REST_FRAMEWORK["NUM_PROXIES"] comment in
      # settings.py for why an unset value here is a rate-limit bypass, not
      # just a missing nice-to-have.
      NUM_PROXIES: ${NUM_PROXIES:-}
      DATABASE_URL: postgresql://mycar:mycar@db:5432/mycar
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mycar.com}
      # Deliberately no default. Left empty, seed_admin generates a random
      # password and prints it once — which is what you want. A baked-in
      # default is a publicly known superuser password the moment it ships.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set DEFAULT_FROM_EMAIL in your .env (see .env.example)}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-10}
      SUPPORT_REQUEST_THROTTLE: ${SUPPORT_REQUEST_THROTTLE:-5/hour}
      # See #74 — the deploy workflow exports this before `build`/`up` (the
      # release tag for prod, "dev-<short sha>" for dev); unset locally.
      APP_VERSION: ${APP_VERSION:-dev}
      # Was missing from this list entirely -- CLOUDINARY_URL being in .env
      # never actually reached the container, so utils.Cloudinary.delete_photos()
      # has been silently no-op'ing (logs a warning, does nothing) in every
      # Docker-based environment. Blank is still a valid, intentional value
      # (see settings.py's comment on CLOUDINARY_URL) -- just needs to
      # actually reach the container to be effective when it's set.
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      # Destination account for the one-off migrate_cloudinary_assets
      # command (see #48) -- blank outside of an actual migration run.
      NEW_CLOUD_NAME: ${NEW_CLOUD_NAME:-}
      NEW_CLOUDINARY_API_KEY: ${NEW_CLOUDINARY_API_KEY:-}
      NEW_CLOUDINARY_API_SECRET: ${NEW_CLOUDINARY_API_SECRET:-}
      # See #94 — what Car.save() sets photo_url to for a car created
      # without one. Blank leaves photo_url genuinely unset, same as before.
      DEFAULT_PHOTO_URL: ${DEFAULT_PHOTO_URL:-}
      # Same "present in .env but never reached the container" gap as
      # CLOUDINARY_URL above, audited and fixed for everything else
      # settings.py reads via decouple's config() — this is why the AI
      # assistant was silently broken in every deployment despite a real
      # GEMINI_API_KEY being set in .env. Each fallback here mirrors that
      # var's actual settings.py default exactly (not blank) wherever it's
      # cast to int, since decouple's int cast raises on an empty string
      # rather than falling back to the default -- a blank fallback here
      # would crash Django at import time instead of just misconfiguring
      # one feature.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      ANON_THROTTLE: ${ANON_THROTTLE:-60/min}
      USER_THROTTLE: ${USER_THROTTLE:-240/min}
      ASSISTANT_CHAT_THROTTLE: ${ASSISTANT_CHAT_THROTTLE:-30/min}
      AUTH_LOGIN_THROTTLE: ${AUTH_LOGIN_THROTTLE:-10/min}
      AUTH_REGISTER_THROTTLE: ${AUTH_REGISTER_THROTTLE:-10/hour}
      AUTH_VERIFY_OTP_THROTTLE: ${AUTH_VERIFY_OTP_THROTTLE:-10/hour}
      AUTH_RESEND_OTP_THROTTLE: ${AUTH_RESEND_OTP_THROTTLE:-5/hour}
      AUTH_PASSWORD_RESET_REQUEST_THROTTLE: ${AUTH_PASSWORD_RESET_REQUEST_THROTTLE:-5/hour}
      AUTH_PASSWORD_RESET_CONFIRM_THROTTLE: ${AUTH_PASSWORD_RESET_CONFIRM_THROTTLE:-10/hour}
      CAR_CACHE_TTL_SECONDS: ${CAR_CACHE_TTL_SECONDS:-86400}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CELERY_BROKER_SSL_CA_CERTS: ${CELERY_BROKER_SSL_CA_CERTS:-}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-60}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      # SECURE_SSL_REDIRECT/SESSION_COOKIE_SECURE/CSRF_COOKIE_SECURE/
      # SECURE_HSTS_* are deliberately NOT here. Their settings.py defaults
      # are dynamic (`not DEBUG`) — Compose can't compute that, only Python
      # can at settings-import time. Adding e.g. `${SECURE_SSL_REDIRECT:-True}`
      # would freeze that to prod's answer even for local dev (DEBUG=True),
      # breaking plain-HTTP local testing; a blank fallback is worse, since
      # decouple's bool cast treats a present-but-empty value as False
      # outright rather than falling back to the default — silently
      # disabling HTTPS redirect/secure cookies/HSTS in prod. Leaving these
      # genuinely absent from the container's environment is what lets
      # settings.py's own `not DEBUG` logic run correctly; only touch this
      # if the goal is to actually override one of these per-environment,
      # and if so, fix settings.py to treat blank specially first (see
      # NUM_PROXIES's custom cast lambda for the pattern).
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8001}:8001"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Lets a deploy step (`docker compose up -d --wait`) fail loudly instead
    # of reporting success while gunicorn is up but the app itself is broken.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # See the top-level `networks:` comment — only load-bearing for the
    # droplet's dev stack, harmless (unused) for prod and local dev.
    networks:
      - default
      - caddy_net

  # Gated behind the "full" profile — `docker compose up` skips
  # profile-tagged services unless that profile is active. Local dev and the
  # droplet's dev stack both run without --profile full (see #81: async
  # email/reminder features just won't fire there, which is fine for
  # QA/preview — memory on the droplet is tight enough running two stacks
  # that trimming these was worth doing rather than "nice to have"). The
  # prod deploy job passes --profile full explicitly.
  worker:
    build: ./api
    restart: unless-stopped
    profiles: ["full"]
    command: celery -A config worker --loglevel=info
    environment: *api_env
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./api
    restart: unless-stopped
    profiles: ["full"]
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment: *api_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001/api/v1}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
        NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET}
        NEXT_PUBLIC_TELEMETRYDECK_APP_ID: ${NEXT_PUBLIC_TELEMETRYDECK_APP_ID}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - default
      - caddy_net

volumes:
  postgres_data:
  media_data:

# caddy_net is a pre-created (`docker network create caddy_net`), external
# network shared between the prod and dev Compose projects on the droplet —
# the only way for prod's Caddy to reach dev's containers by Docker's
# embedded DNS. They're otherwise on entirely separate default networks, one
# per Compose project, and a container in one can't resolve a service name in
# the other. Host-published ports don't help either unless bound to 0.0.0.0,
# which is a real public-exposure risk — Docker's port publishing bypasses
# UFW entirely, so a port bound to anything but 127.0.0.1 is reachable from
# the open internet regardless of firewall rules (confirmed during the
# original migration). This is the network-level fix instead.
# No-op locally: nothing here reaches for caddy_net unless it's actually been
# created, and nothing tries to until docker-compose.prod.yml's caddy service
# does.
networks:
  caddy_net:
    external: true

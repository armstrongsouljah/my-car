<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#f4f4f7;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px;">
        <tr><td style="font-size:20px;font-weight:700;color:#111827;padding-bottom:16px;">{{ car_label }} needs attention</td></tr>
        <tr><td style="font-size:15px;color:#374151;padding-bottom:16px;">Hi {{ name }},</td></tr>
        <tr><td style="padding-bottom:24px;">
          {% for reminder in reminders %}
          <div style="font-size:14px;color:#374151;background:{% if reminder.status == 'overdue' %}#fef2f2{% else %}#fffbeb{% endif %};border-radius:8px;padding:12px 16px;margin-bottom:8px;">
            {{ reminder.message }}
          </div>
          {% endfor %}
        </td></tr>
        <tr><td align="center">
          <a href="{{ car_url }}" style="display:inline-block;background:#111827;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;border-radius:8px;padding:12px 28px;">Review in GlavBox</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>

[project]
name = "my-car-api"
version = "0.1.0"
description = "My Car — vehicle service history, expense tracking and reminders API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.4",
    "django-cors-headers>=4.6",
    "django-redis>=5.4",
    "django-celery-results>=2.5",
    "celery>=5.4",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "python-decouple>=3.8",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    "google-auth>=2.36",
    "python-dateutil>=2.9",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pre-commit>=4.0",
    "ruff>=0.9",
    "black>=25.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["tests.py", "test_*.py"]

[tool.black]
line-length = 119
target-version = ["py312"]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "cars", "services", "inspections", "expenses", "utils", "config", "tasks"]

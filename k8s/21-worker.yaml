apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: mycar
  labels: { app: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: ${REGISTRY}/mycar-api:${IMAGE_TAG}
          # Prefork concurrency defaults to host CPU count, which forks far more
          # workers than the memory limit below can hold — pin it explicitly.
          command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
          envFrom:
            - secretRef: { name: mycar-env }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }

# Template only — DO NOT commit real secrets.
# Copy to a private secret.yaml, fill in values, then `kubectl apply -f secret.yaml`.
# Or generate it imperatively from env vars via scripts/deploy-gke.sh (preferred).
apiVersion: v1
kind: Secret
metadata:
  name: mycar-env
  namespace: mycar
type: Opaque
stringData:
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(64))"
  SECRET_KEY: "change-me-django-secret"
  DEBUG: "False"
  ALLOWED_HOSTS: "api.example.com,api"
  # The Gateway sets X-Forwarded-For as "<client>, <gclb>", so 2 hops back is
  # the real client IP. Without this, rate limits key off a spoofable header.
  NUM_PROXIES: "2"
  # Cloud SQL for Postgres, private IP (sslmode=require)
  DATABASE_URL: "postgresql://mycar:<DB_PASSWORD>@<PG_HOST>:5432/mycar?sslmode=require"
  # Memorystore for Redis, private IP + AUTH. DB 1 = cache, DB 0 = celery broker/result.
  REDIS_URL: "redis://:<REDIS_AUTH>@<REDIS_HOST>:6379/1"
  CELERY_BROKER_URL: "redis://:<REDIS_AUTH>@<REDIS_HOST>:6379/0"
  CELERY_RESULT_BACKEND: "redis://:<REDIS_AUTH>@<REDIS_HOST>:6379/0"
  CORS_ALLOWED_ORIGINS: "https://app.example.com"
  FRONTEND_URL: "https://app.example.com"
  # Super admin, seeded by the migrate Job.
  # Leave ADMIN_PASSWORD empty: seed_admin then generates a random password and
  # logs it once on first boot (`kubectl logs job/migrate`). Store it in your
  # password manager and never put a literal here — a placeholder that survives
  # to production is a publicly known superuser password on a public /admin/.
  ADMIN_EMAIL: "admin@mycar.com"
  ADMIN_PASSWORD: ""
  # Google OAuth (optional)
  GOOGLE_OAUTH_CLIENT_ID: ""
  # Email
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "True"
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  DEFAULT_FROM_EMAIL: "support@glavbox.com"
  OTP_EXPIRY_MINUTES: "10"
  SUPPORT_REQUEST_THROTTLE: "5/hour"

# Uses GKE's Gateway API controller (external Global L7 load balancer). Modern
# GKE clusters route through Gateway API rather than the legacy "gce" Ingress
# controller — a plain networking.k8s.io/v1 Ingress is never reconciled here.
#
# TLS is Google-managed via Certificate Manager, not a Gateway TLS
# certificateRef — the certmap annotation below points at a certificate map.
# See docs/deploy-gke.md for the gcloud certificate-manager commands that
# create it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mycar
  namespace: mycar
  annotations:
    networking.gke.io/certmap: mycar-cert-map
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: Same }
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: mycar
spec:
  parentRefs:
    - name: mycar
      sectionName: https
  hostnames:
    - app.glavbox.com
  rules:
    - backendRefs:
        - name: frontend
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: mycar
spec:
  parentRefs:
    - name: mycar
      sectionName: https
  hostnames:
    - api.glavbox.com
  rules:
    - backendRefs:
        - name: api
          port: 80
---
# Plain HTTP never serves the app — redirect straight to HTTPS instead of
# letting the http listener's default (no route bound) behavior apply.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: mycar
spec:
  parentRefs:
    - name: mycar
      sectionName: http
  hostnames:
    - app.glavbox.com
    - api.glavbox.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Django's ALLOWED_HOSTS rejects the default GCLB health check (Host header =
# backend IP) with a 400, which the LB then reads as unhealthy. Point the
# check at a Host that's always in ALLOWED_HOSTS ("api", from k8s/10-secret.
# example.yaml) and a path that returns 200 without auth.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: api
  namespace: mycar
spec:
  targetRef:
    group: ""
    kind: Service
    name: api
  default:
    config:
      type: HTTP
      httpHealthCheck:
        # config/urls.py's health() view is exempt from SECURE_SSL_REDIRECT
        # (settings.py SECURE_REDIRECT_EXEMPT) specifically so this plain-HTTP
        # check gets a 200 instead of a 301 the LB won't follow. /admin/login/
        # used to work here but stopped being exempt once SECURE_SSL_REDIRECT
        # was turned on for prod.
        requestPath: /health/
        host: api

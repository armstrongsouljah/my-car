apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mycar
  labels: { app: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          # NEXT_PUBLIC_API_URL is baked at BUILD time (see deploy-gke.sh --build-arg).
          image: ${REGISTRY}/mycar-frontend:${IMAGE_TAG}
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mycar
spec:
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 3000

apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: mycar
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: migrate }
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ${REGISTRY}/mycar-api:${IMAGE_TAG}
          # Runs migrations then seeds the super admin (idempotent).
          command: ["/bin/sh", "-c", "python manage.py migrate --no-input && python manage.py seed_admin"]
          envFrom:
            - secretRef: { name: mycar-env }

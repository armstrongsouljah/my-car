# Uses GKE's built-in "gce" ingress controller (external HTTP(S) load balancer,
# container-native via NEGs — works out of the box on VPC-native/Autopilot
# clusters, no add-on to enable).
# Replace the hostnames with your DNS records, then add TLS by creating a
# networking.gke.io/v1 ManagedCertificate per host and referencing it via the
# "networking.gke.io/managed-certificates" annotation, once DNS points at the
# ingress external IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mycar
  namespace: mycar
spec:
  ingressClassName: gce
  rules:
    - host: app.example.com          # frontend
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
    - host: api.example.com          # Django API + /admin + /static
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 80 }

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mycar
  labels: { app: api }
spec:
  replicas: 2
  # GKE Gateway/NEG backend-attachment can take longer than the 600s default
  # to confirm a new pod healthy, causing `kubectl rollout status` to report
  # ProgressDeadlineExceeded even though the rollout goes on to succeed.
  progressDeadlineSeconds: 1200
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ${REGISTRY}/mycar-api:${IMAGE_TAG}
          # Explicit command => entrypoint execs it and SKIPS auto-migrate/seed.
          # Migrations run once via the migrate Job (40-migrate-job.yaml).
          # newrelic-admin run-program wraps gunicorn to install the APM agent
          # before Django/DRF import — see NEW_RELIC_LICENSE_KEY in mycar-env.
          command:
            - newrelic-admin
            - run-program
            - gunicorn
            - config.wsgi:application
            - --bind
            - 0.0.0.0:8001
            - --workers
            - "1"
            - --threads
            - "8"
            - --timeout
            - "0"
          ports:
            - containerPort: 8001
          env:
            - { name: NEW_RELIC_APP_NAME, value: "GlavBox API" }
          envFrom:
            - secretRef: { name: mycar-env }
          readinessProbe:
            tcpSocket: { port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8001 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mycar
spec:
  selector: { app: api }
  ports:
    - port: 80
      targetPort: 8001
